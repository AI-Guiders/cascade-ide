# CascadeIDE — манифест языков Forward-редактора (Monaco).
# Аналог VS Code package.json → contributes.languages + grammars.
#
# Загрузка:
#   1) Settings/editor-languages.toml рядом с exe (или встроенный ресурс)
#   2) опционально %LocalAppData%\CascadeIDE\editor-languages.toml — merge/override по id
#
# Поля:
#   id          — логический язык в IDE (MCP, UI)
#   display     — человекочитаемое имя
#   extensions  — суффиксы файлов (с точкой)
#   monaco      — languageId в Monaco; если опущен — совпадает с id
#   attach      — учитывать в IsTextFilePath / excerpt (default true)

schema_version = 1

# Текст без подсветки, но читаемый как текст (attach, excerpt)
[[plain_text]]
extensions = [".txt", ".log", ".jsx"]

# --- built-in Monaco basic-languages + Monarch (toml) ---

[[languages]]
id = "csharp"
display = "C#"
extensions = [".cs", ".csx"]
monaco = "csharp"

[[languages]]
id = "razor"
display = "Razor"
extensions = [".razor", ".cshtml"]
monaco = "razor"

[[languages]]
id = "xml"
display = "XML"
extensions = [
  ".xml",
  ".axaml",
  ".xaml",
  ".csproj",
  ".fsproj",
  ".vbproj",
  ".props",
  ".targets",
  ".config",
]
monaco = "xml"

[[languages]]
id = "json"
display = "JSON"
extensions = [".json"]

